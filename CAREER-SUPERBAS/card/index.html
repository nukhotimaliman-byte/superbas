        </div>
        <span class="user-bar-name" id="userName">—</span>
      </div>
      <button class="btn-logout" id="btnLogout">Logout</button>
    </div>

    <!-- Editor Controls -->
    <div class="editor-controls">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Isi Data ID Card

      <div class="form-group">

      <div class="photo-upload" id="photoUpload">

        </div>

            <span id="lockLabel">Ubah</span>

      <div class="download-actions">

          Download Depan

        <button class="btn-download btn-download--outline" id="btnDownloadBack" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

    <!-- Card Previews (Canvas-based) -->
    <div class="cards-preview">
      <!-- FRONT -->
      <div class="card-preview-wrapper">
        <div class="card-preview-label">Depan</div>

      </div>

      <!-- BACK -->
      <div class="card-preview-wrapper">
        <div class="card-preview-label">Belakang</div>

</div>

<!-- Password Modal -->
<div class="modal-overlay" id="pwdModal">
  <div class="modal-content">
    <h3>Buka Kunci Jabatan</h3>

    </div>
    <div class="modal-actions">

      <button class="btn-confirm" id="btnConfirmPwd">Ubah</button>
    </div>
  </div>
</div>

<!-- Crop Modal -->
<div class="modal-overlay" id="cropModal">
  <div class="modal-content" style="max-width: 500px; width: 95%;">
    <h3>Sesuaikan Foto</h3>
    <div style="max-height: 50vh; overflow: hidden; background: #000; border-radius: 8px; margin-bottom: 16px;">
      <img id="cropImage" src="" style="max-width: 100%; display: block;">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancelCrop">Batal</button>
      <button class="btn-confirm" id="btnConfirmCrop">Selesai</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== Config =====
const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname) || location.protocol === 'file:';
const API_BASE = '../daily-worker/api/user-auth.php';

// Card-specific accounts (for standalone use)
const CARD_ACCOUNTS = [
  { username: 'alimganteng', password: 'alimganteng', name: 'Alim' }
];

// ===== Template coordinates (from pixel analysis of 3078x5169 image) =====
const TPL = {
  imgW: 3078,
  imgH: 5169,
  // Transparent hole area (matches RED BOX only)
  hole: { x: 780, y: 1620, w: 1525, h: 1935 },
  // Horizontal line Y position
  lineY: 4087,
  // Name text: centered, above the line
  nameY: 4020,
  // Title text: centered, below the line
  titleY: 4155
};

// Canvas display size (aspect ratio matches template)
const CANVAS_DISPLAY_W = 320;
const CANVAS_DISPLAY_H = Math.round(CANVAS_DISPLAY_W * (TPL.imgH / TPL.imgW));

// ===== DOM Elements =====
const $ = id => document.getElementById(id);
const loginSection = $('loginSection');
const editorSection = $('editorSection');
const loginForm = $('loginForm');
const loginError = $('loginError');
const btnLogin = $('btnLogin');
const inputName = $('inputName');
const photoInput = $('photoInput');
const photoUpload = $('photoUpload');
const photoPreview = $('photoPreview');
const btnDownloadFront = $('btnDownloadFront');
const btnDownloadBack = $('btnDownloadBack');
const userName = $('userName');
const toast = $('toast');

const canvas = $('cardFrontCanvas');
const ctx = canvas.getContext('2d');

let currentUser = null;
let userPhotoImg = null;      // Image object of user photo
let templateImg = null;       // 1-template.png (with hole)
let originalImg = null;       // 1.png (original, for fallback)
let backImg = null;           // 2.png

// ===== Theme Toggle =====
$('themeToggle')?.addEventListener('click', () => {
  const c = document.documentElement.getAttribute('data-theme') || 'dark';
  const n = c === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', n);
  try { localStorage.setItem('bas-theme', n); } catch {}
});

// ===== Toast =====
function showToast(msg, type = '') {
  toast.textContent = msg;
  toast.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ===== Load Images =====
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function loadTemplateImages() {
  try {
    [templateImg, backImg] = await Promise.all([
      loadImage('ID%20CARD/1-template.png'),
      loadImage('ID%20CARD/2.png')
    ]);
    console.log('Template images loaded:', templateImg.width, 'x', templateImg.height);
    drawCard();
  } catch (err) {
    console.error('Failed to load template:', err);
    showToast('Gagal memuat template', 'error');
  }
}

// ===== Canvas Drawing =====
function drawCard() {
  if (!templateImg) return;

  // Set canvas internal resolution to template size (high-res)
  canvas.width = TPL.imgW;
  canvas.height = TPL.imgH;

  // Set display size (CSS)
  canvas.style.width = CANVAS_DISPLAY_W + 'px';
  canvas.style.height = CANVAS_DISPLAY_H + 'px';

  // Clear
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Draw user photo FIRST (behind template)
  if (userPhotoImg) {
    const hole = TPL.hole;
    // The cropper already gives us an image matching the hole's exact aspect ratio
    // Clip to rounded rectangle for the hole area
    ctx.save();
    roundRect(ctx, hole.x, hole.y, hole.w, hole.h, 120);
    ctx.clip();
    ctx.drawImage(userPhotoImg, hole.x, hole.y, hole.w, hole.h);
    ctx.restore();
  }

  // 2. Draw template on top (with transparent hole — photo shows through)
  ctx.drawImage(templateImg, 0, 0, TPL.imgW, TPL.imgH);

  // 3. Draw name text above the line
  const nameText = inputName.value.trim() || '';
  if (nameText) {
    ctx.font = 'bold 180px "Open Sans", Arial, Helvetica, sans-serif';
    ctx.fillStyle = '#1a1a1a';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(nameText, TPL.imgW / 2, TPL.nameY);
  }

  // 4. Draw "Koordinator Lapangan" below the line
  ctx.font = '600 140px "Open Sans", Arial, Helvetica, sans-serif';
  ctx.fillStyle = '#333';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(inputTitle.value || 'Koordinator Lapangan', TPL.imgW / 2, TPL.titleY);
}

// Helper: cover-fit (like CSS object-fit: cover)
function coverFit(srcW, srcH, dstW, dstH) {
  const srcRatio = srcW / srcH;
  const dstRatio = dstW / dstH;
  let sx, sy, sw, sh;
  if (srcRatio > dstRatio) {
    // Source is wider — crop sides
    sh = srcH;
    sw = srcH * dstRatio;
    sx = (srcW - sw) / 2;
    sy = 0;
  } else {
    // Source is taller — crop top/bottom
    sw = srcW;
    sh = srcW / dstRatio;
    sx = 0;
    sy = (srcH - sh) / 2;
  }
  return { sx, sy, sw, sh };
}

// Helper: draw rounded rectangle path
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ===== Auth: Check Session =====
async function checkSession() {
  const saved = localStorage.getItem('bas-card-user');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      showEditor();
      return;
    } catch {}
  }
  if (!isLocal) {
    try {
      const res = await fetch(API_BASE + '?action=check', { credentials: 'include' });
      const data = await res.json();
      if (data.authenticated) {
        currentUser = data.user;
        showEditor();
      }
    } catch (e) {}
  }
}

// ===== Auth: Login =====
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const identifier = $('loginId').value.trim();
  const password = $('loginPass').value;
  if (!identifier || !password) return;

  btnLogin.disabled = true;
  btnLogin.innerHTML = '<span class="loading-spinner"></span> Memproses...';
  loginError.classList.remove('show');

  // 1. Check card-specific accounts
  const cardAccount = CARD_ACCOUNTS.find(
    a => a.username === identifier && a.password === password
  );
  if (cardAccount) {
    currentUser = { id: 0, name: cardAccount.name, role: 'card_user' };
    localStorage.setItem('bas-card-user', JSON.stringify(currentUser));
    showToast('Login berhasil!', 'success');
    showEditor();
    btnLogin.disabled = false;
    btnLogin.textContent = 'Masuk';
    return;
  }

  // 2. Fallback: DW API
  try {
    const res = await fetch(API_BASE + '?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username: identifier, password })
    });
    const data = await res.json();
    if (data.success) {
      currentUser = data.user;
      localStorage.setItem('bas-card-user', JSON.stringify(currentUser));
      showToast('Login berhasil!', 'success');
      showEditor();
    } else {
      loginError.textContent = data.error || 'Username atau password salah';
      loginError.classList.add('show');
    }
  } catch (err) {
    loginError.textContent = 'Username atau password salah';
    loginError.classList.add('show');
  } finally {
    btnLogin.disabled = false;
    btnLogin.textContent = 'Masuk';
  }
});

// ===== Auth: Logout =====
$('btnLogout').addEventListener('click', async () => {
  localStorage.removeItem('bas-card-user');
  try { await fetch(API_BASE + '?action=logout', { method: 'POST', credentials: 'include' }); } catch {}
  currentUser = null;
  userPhotoImg = null;
  showLogin();
  showToast('Logout berhasil');
});

// ===== UI: Switch sections =====
function showEditor() {
  loginSection.style.display = 'none';
  editorSection.classList.add('active');
  userName.textContent = currentUser?.name || 'User';
  if (currentUser?.name) {
    inputName.value = currentUser.name;
  }
  loadTemplateImages();
  updateDownloadButtons();
}

function showLogin() {
  loginSection.style.display = 'block';
  editorSection.classList.remove('active');
  loginForm.reset();
  loginError.classList.remove('show');
  inputName.value = '';
  resetPhoto();
}

// ===== Title unlock =====
const inputTitle = $('inputTitle');
const btnTitleUnlock = $('btnTitleUnlock');
const lockIcon = $('lockIcon');
const lockLabel = $('lockLabel');
const TITLE_PASSWORD = 'alimgantengbanget';

const pwdModal = $('pwdModal');
const pwdInput = $('pwdInput');
const btnCancelPwd = $('btnCancelPwd');
const btnConfirmPwd = $('btnConfirmPwd');

function showPwdModal() {
  pwdModal.classList.add('show');
  pwdInput.value = '';
  setTimeout(() => pwdInput.focus(), 100);
}

function hidePwdModal() {
  pwdModal.classList.remove('show');
}

btnCancelPwd.addEventListener('click', hidePwdModal);

btnConfirmPwd.addEventListener('click', () => {
  const pwd = pwdInput.value;
  hidePwdModal();
  if (pwd === TITLE_PASSWORD) {
    inputTitle.disabled = false;
    lockIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 015-5 5 5 0 015 5"/>';
    lockLabel.textContent = 'Kunci';
    btnTitleUnlock.classList.add('unlocked');
    inputTitle.focus();
    showToast('Jabatan berhasil di-unlock!', 'success');
  } else if (pwd !== '') {
    showToast('Password salah', 'error');
  }
});

pwdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') btnConfirmPwd.click();
  if (e.key === 'Escape') hidePwdModal();
});

btnTitleUnlock.addEventListener('click', (e) => {
  e.preventDefault();
  
  if (!inputTitle.disabled) {
    // Lock it back
    inputTitle.disabled = true;
    lockIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>';
    lockLabel.textContent = 'Ubah';
    btnTitleUnlock.classList.remove('unlocked');
    return;
  }
  
  // Show custom modal instead of prompt
  showPwdModal();
});

inputTitle.addEventListener('input', () => {
  drawCard();
});

// ===== Name Input → Live Preview =====
inputName.addEventListener('input', () => {
  drawCard();
  updateDownloadButtons();
});

// ===== Photo Upload =====
photoInput.addEventListener('change', handlePhotoSelect);

photoUpload.addEventListener('dragover', (e) => {
  e.preventDefault();
  photoUpload.style.borderColor = 'var(--accent)';
});
photoUpload.addEventListener('dragleave', () => { photoUpload.style.borderColor = ''; });
photoUpload.addEventListener('drop', (e) => {
  e.preventDefault();
  photoUpload.style.borderColor = '';
  if (e.dataTransfer?.files?.length) {
    photoInput.files = e.dataTransfer.files;
    handlePhotoSelect();
  }
});

// ===== Cropper =====
let cropper = null;
const cropModal = $('cropModal');
const cropImage = $('cropImage');
const btnCancelCrop = $('btnCancelCrop');
const btnConfirmCrop = $('btnConfirmCrop');

function handlePhotoSelect() {
  const file = photoInput.files?.[0];
  if (!file) return;

  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
    showToast('Format file harus JPG / PNG', 'error');
    photoInput.value = '';
    return;
  }
  // Limit upload size to 10MB (to prevent browser crash)
  if (file.size > 10 * 1024 * 1024) {
    showToast('Ukuran file maksimal 10MB', 'error');
    photoInput.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    cropImage.src = e.target.result;
    cropModal.classList.add('show');
    
    if (cropper) cropper.destroy();
    
    cropper = new Cropper(cropImage, {
      aspectRatio: TPL.hole.w / TPL.hole.h,
      viewMode: 1,
      dragMode: 'move',
      autoCropArea: 1,
      restore: false,
      guides: true,
      center: true,
      highlight: false,
      cropBoxMovable: true,
      cropBoxResizable: true,
      toggleDragModeOnDblclick: false,
    });
  };
  reader.readAsDataURL(file);
}

btnCancelCrop.addEventListener('click', () => {
  cropModal.classList.remove('show');
  if (cropper) { cropper.destroy(); cropper = null; }
  photoInput.value = '';
});

btnConfirmCrop.addEventListener('click', () => {
  if (!cropper) return;
  
  // Get high res cropped canvas matching the hole dimensions
  const canvasCrop = cropper.getCroppedCanvas({
    width: TPL.hole.w,
    height: TPL.hole.h,
    imageSmoothingEnabled: true,
    imageSmoothingQuality: 'high',
  });
  
  const img = new Image();
  img.onload = () => {
    userPhotoImg = img;
    photoPreview.src = img.src;
    photoUpload.classList.add('has-photo');
    drawCard();
    updateDownloadButtons();
    
    cropModal.classList.remove('show');
    if (cropper) { cropper.destroy(); cropper = null; }
  };
  img.src = canvasCrop.toDataURL('image/jpeg', 0.95);
});

function resetPhoto() {
  userPhotoImg = null;
  photoUpload.classList.remove('has-photo');
  photoPreview.src = '';
  photoInput.value = '';
  drawCard();
  updateDownloadButtons();
}

function updateDownloadButtons() {
  const hasName = inputName.value.trim().length > 0;
  const hasPhoto = !!userPhotoImg;
  btnDownloadFront.disabled = !(hasName && hasPhoto);
  btnDownloadBack.disabled = false;
}

// ===== Download PNG =====
function downloadCanvas(canvasEl, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvasEl.toDataURL('image/png', 1.0);
  link.click();
}

btnDownloadFront.addEventListener('click', () => {
  const name = (inputName.value.trim() || 'BAS').replace(/\s+/g, '_');
  downloadCanvas(canvas, `IDCard-Depan-${name}.png`);
  showToast('ID Card depan berhasil didownload!', 'success');
});

btnDownloadBack.addEventListener('click', async () => {
  // Draw back card on a temporary canvas
  if (!backImg) {
    showToast('Template belakang belum dimuat', 'error');
    return;
  }
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = backImg.width;
  tmpCanvas.height = backImg.height;
  const tmpCtx = tmpCanvas.getContext('2d');
  tmpCtx.drawImage(backImg, 0, 0);
  downloadCanvas(tmpCanvas, 'IDCard-Belakang-BAS.png');
  showToast('ID Card belakang berhasil didownload!', 'success');
});

// ===== Init =====
checkSession();
</script>
</body>
</html>
